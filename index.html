  <style>
    :root{
      --bg0:#0a0710;
      --text: rgba(255,255,255,.93);
      --muted: rgba(255,255,255,.72);
      --muted2: rgba(255,255,255,.60);

      --glass: rgba(255,255,255,.09);
      --glass2: rgba(255,255,255,.06);
      --stroke: rgba(255,255,255,.14);

      --pink:#ff4fa3;
      --pink2:#ff77c3;
      --rose:#ffb7d9;
      --gold:#ffd6a2;

      --shadow: 0 24px 90px rgba(0,0,0,.55);
      --shadow2: 0 12px 40px rgba(0,0,0,.45);

      --r: 22px;
      --r2: 30px;
    }

    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      font-family:"Cairo", system-ui, -apple-system, Segoe UI, Arial;
      color:var(--text);
      background:
        radial-gradient(1200px 600px at 70% 20%, rgba(255,79,163,.24), transparent 60%),
        radial-gradient(900px 500px at 20% 60%, rgba(255,214,162,.18), transparent 55%),
        radial-gradient(1100px 700px at 50% 90%, rgba(255,119,195,.12), transparent 60%),
        linear-gradient(180deg, #07030b 0%, #0b0710 50%, #07030b 100%);
      overflow-x:hidden;
    }
    a{color:inherit; text-decoration:none}

    /* ===== Soft animated background ===== */
    .bg{position:fixed; inset:-40px; z-index:-2; pointer-events:none; filter: blur(22px); opacity:.85;}
    .blob{
      position:absolute; width:520px; height:520px;
      border-radius:42% 58% 52% 48% / 48% 45% 55% 52%;
      background: radial-gradient(circle at 30% 30%, rgba(255,79,163,.55), rgba(255,79,163,.05) 70%);
      animation: floaty 12s ease-in-out infinite;
      mix-blend-mode: screen;
    }
    .blob.b1{left:-160px; top:-40px;}
    .blob.b2{
      width:560px; height:560px;
      right:-140px; top:120px;
      background: radial-gradient(circle at 30% 30%, rgba(255,214,162,.45), rgba(255,214,162,.04) 70%);
      animation-duration:14s;
    }
    .blob.b3{
      width:620px; height:620px;
      left:25%; bottom:-260px;
      background: radial-gradient(circle at 30% 30%, rgba(255,119,195,.35), rgba(255,119,195,.04) 70%);
      animation-duration:16s;
    }
    @keyframes floaty{
      0%,100%{transform:translate(0,0) rotate(0deg)}
      50%{transform:translate(40px,-30px) rotate(10deg)}
    }

    /* Subtle sparkles */
    .sparkles{
      position:fixed; inset:0; z-index:-1; pointer-events:none;
      background-image:
        radial-gradient(2px 2px at 15% 25%, rgba(255,255,255,.40) 45%, transparent 55%),
        radial-gradient(1.5px 1.5px at 35% 70%, rgba(255,255,255,.25) 45%, transparent 55%),
        radial-gradient(2px 2px at 78% 60%, rgba(255,255,255,.28) 45%, transparent 55%),
        radial-gradient(1.5px 1.5px at 10% 85%, rgba(255,255,255,.22) 45%, transparent 55%);
      opacity:.55;
      animation: twinkle 5.5s ease-in-out infinite;
    }
    @keyframes twinkle{
      0%,100%{opacity:.45; transform: translateY(0)}
      50%{opacity:.70; transform: translateY(-6px)}
    }

    /* ===== Preloader ===== */
    .preloader{
      position:fixed; inset:0; z-index:9999;
      display:grid; place-items:center;
      background:
        radial-gradient(900px 500px at 70% 20%, rgba(255,79,163,.18), transparent 60%),
        radial-gradient(900px 500px at 20% 60%, rgba(255,214,162,.14), transparent 55%),
        linear-gradient(180deg, #07030b 0%, #0b0710 50%, #07030b 100%);
      transition: opacity .5s ease, transform .5s ease;
    }
    .preloader.hide{opacity:0; transform: translateY(-6px); pointer-events:none;}
    .prebox{
      width:min(420px, 88vw);
      padding:22px;
      border-radius:28px;
      border:1px solid rgba(255,255,255,.14);
      background: linear-gradient(180deg, rgba(255,255,255,.10), rgba(255,255,255,.06));
      box-shadow: var(--shadow);
      text-align:center;
      position:relative;
      overflow:hidden;
      backdrop-filter: blur(16px);
    }
    .prebox::before{
      content:"";
      position:absolute; inset:-2px;
      background: radial-gradient(520px 220px at 50% 0%, rgba(255,214,162,.18), transparent 60%),
                  radial-gradient(520px 220px at 80% 55%, rgba(255,79,163,.18), transparent 60%);
      pointer-events:none;
    }
    .prelogo{
      width:92px; height:92px;
      border-radius:26px;
      margin: 6px auto 10px;
      border:1px solid rgba(255,255,255,.14);
      background: rgba(0,0,0,.20);
      display:grid; place-items:center;
      overflow:hidden;
      position:relative;
      box-shadow: 0 18px 50px rgba(0,0,0,.40);
    }
    .prelogo img{width:100%; height:100%; object-fit:cover; display:block;}
    .ring{
      width:110px; height:110px;
      border-radius:999px;
      margin: 10px auto 8px;
      border: 2px solid rgba(255,214,162,.28);
      border-top-color: rgba(255,214,162,.95);
      animation: spin 1.1s linear infinite;
      box-shadow: 0 0 0 10px rgba(255,79,163,.06);
    }
    @keyframes spin{to{transform:rotate(360deg)}}
    .pretitle{
      font-family:"Playfair Display", serif;
      font-weight:700;
      margin: 6px 0 2px;
      letter-spacing:.3px;
    }
    .presub{
      margin:0;
      color: rgba(255,255,255,.72);
      font-weight:700;
      font-size: 12px;
      line-height:1.8;
    }
    .shine{
      position:absolute; inset:-40px;
      background: linear-gradient(120deg, transparent 0%, rgba(255,255,255,.16) 35%, transparent 55%);
      transform: translateX(-60%) rotate(18deg);
      animation: shine 4.8s ease-in-out infinite;
      pointer-events:none;
      opacity:.55;
    }
    @keyframes shine{
      0%,55%{ transform: translateX(-70%) rotate(18deg); opacity:.0}
      70%{opacity:.55}
      100%{ transform: translateX(90%) rotate(18deg); opacity:0}
    }

    /* ===== Layout ===== */
    .container{width:min(1100px, 92vw); margin:0 auto}
    .topbar{
      position:sticky; top:0; z-index:60;
      backdrop-filter: blur(16px);
      background: linear-gradient(180deg, rgba(10,6,16,.78), rgba(10,6,16,.35));
      border-bottom: 1px solid rgba(255,255,255,.08);
    }
    .topbar .wrap{display:flex; align-items:center; justify-content:space-between; gap:14px; padding:14px 0;}
    .brand{display:flex; align-items:center; gap:12px; min-width:240px;}
    .logo{
      width:46px; height:46px; border-radius:14px;
      background: linear-gradient(135deg, rgba(255,79,163,.18), rgba(255,214,162,.12));
      border:1px solid rgba(255,255,255,.14);
      box-shadow:0 10px 30px rgba(0,0,0,.35);
      overflow:hidden; display:grid; place-items:center;
    }
    .logo img{width:100%; height:100%; object-fit:cover; display:block;}
    .brand h1{margin:0; font-family:"Playfair Display", serif; font-size:18px; line-height:1.2;}
    .brand .sub{margin-top:2px; font-size:12px; color:var(--muted); font-weight:700;}

    .nav{display:flex; align-items:center; gap:10px; flex-wrap:wrap; justify-content:flex-start;}
    .pill{
      padding:10px 14px; border-radius:999px;
      background: rgba(255,255,255,.06);
      border:1px solid rgba(255,255,255,.10);
      font-weight:800; font-size:13px;
      transition:.2s ease;
    }
    .pill:hover{transform:translateY(-1px); background:rgba(255,255,255,.09)}
    .pill.primary{
      background: linear-gradient(135deg, rgba(255,79,163,.95), rgba(255,119,195,.92));
      border-color: rgba(255,255,255,.18);
      box-shadow: 0 14px 40px rgba(255,79,163,.16);
    }

    /* ===== Section entrance animation ===== */
    .reveal{
      opacity:0;
      transform: translateY(22px);
      transition: opacity .65s ease, transform .65s ease;
    }
    .reveal.in{
      opacity:1;
      transform: translateY(0);
    }

    /* ===== Hero ===== */
    header.hero{padding:38px 0 18px;}
    .hero-grid{display:grid; grid-template-columns: 1.2fr .8fr; gap:18px; align-items:stretch;}
    @media (max-width: 920px){ .hero-grid{grid-template-columns:1fr} .brand{min-width:auto} }

    .card{
      border-radius: var(--r2);
      background: linear-gradient(180deg, rgba(255,255,255,.10), rgba(255,255,255,.06));
      border:1px solid rgba(255,255,255,.12);
      box-shadow: var(--shadow);
      overflow:hidden; position:relative;
      backdrop-filter: blur(14px);
    }
    .card::before{
      content:""; position:absolute; inset:-2px;
      background:
        radial-gradient(600px 180px at 50% -10%, rgba(255,214,162,.16), transparent 60%),
        radial-gradient(600px 180px at 80% 40%, rgba(255,79,163,.18), transparent 60%);
      z-index:0; pointer-events:none;
    }
    .card > *{position:relative; z-index:1}
    .hero-left{padding:26px;}
    .badge{
      display:inline-flex; align-items:center; gap:10px;
      padding:10px 14px; border-radius:999px;
      background: rgba(0,0,0,.18);
      border:1px solid rgba(255,255,255,.12);
      font-weight:900; font-size:13px;
    }
    .dot{width:10px; height:10px; border-radius:999px; background: radial-gradient(circle at 30% 30%, var(--gold), var(--pink)); box-shadow:0 0 0 6px rgba(255,79,163,.12);}
    .headline{margin:16px 0 8px; font-size: clamp(30px, 4.5vw, 52px); line-height:1.15; font-weight:900;}
    .headline span{background: linear-gradient(90deg, rgba(255,255,255,.95), rgba(255,183,217,.95)); -webkit-background-clip:text; background-clip:text; color:transparent;}
    .lead{margin:10px 0 0; color: rgba(255,255,255,.78); font-size:16px; line-height:1.9; max-width:62ch;}

    .cta-row{display:flex; gap:10px; flex-wrap:wrap; margin-top:18px;}
    .btn{
      display:inline-flex; align-items:center; justify-content:center; gap:10px;
      padding:14px 16px; border-radius:16px;
      border:1px solid rgba(255,255,255,.14);
      background: rgba(255,255,255,.06);
      box-shadow: var(--shadow2);
      font-weight:900;
      transition:.2s ease;
      min-width: 170px;
      position:relative; overflow:hidden;
    }
    .btn::after{
      content:"";
      position:absolute; inset:0;
      background: linear-gradient(120deg, transparent 20%, rgba(255,255,255,.28), transparent 60%);
      transform: translateX(-120%);
      transition: .65s ease;
      pointer-events:none;
    }
    .btn:hover{transform: translateY(-1px); background: rgba(255,255,255,.09)}
    .btn:hover::after{transform: translateX(120%);}

    .btn.whatsapp{background: linear-gradient(135deg, rgba(37,211,102,.95), rgba(37,211,102,.72)); border-color:rgba(255,255,255,.18); color:#06180d;}
    .btn.tiktok{background: linear-gradient(135deg, rgba(10,10,12,.92), rgba(10,10,12,.62));}
    .btn.secondary{background: linear-gradient(135deg, rgba(255,79,163,.90), rgba(255,214,162,.30));}

    .hero-right{padding:20px; display:flex; flex-direction:column; gap:12px; justify-content:space-between;}
    .mini{border-radius: var(--r); background: rgba(0,0,0,.18); border:1px solid rgba(255,255,255,.10); padding:14px;}
    .mini h3{margin:0 0 6px; font-size:14px; letter-spacing:.2px;}
    .mini p{margin:0; color: rgba(255,255,255,.72); font-size:13px; line-height:1.8;}
    .mini b{font-weight:900}

    /* Live status */
    .status{
      display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap;
      padding:12px 12px; border-radius:18px;
      background: rgba(255,255,255,.06);
      border:1px solid rgba(255,255,255,.10);
    }
    .pulse{display:flex; align-items:center; gap:10px; font-weight:900;}
    .pulseDot{width:12px; height:12px; border-radius:999px; background:#25D366; box-shadow:0 0 0 0 rgba(37,211,102,.55); animation: pulse 1.4s infinite;}
    @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(37,211,102,.55)}70%{box-shadow:0 0 0 14px rgba(37,211,102,0)}100%{box-shadow:0 0 0 0 rgba(37,211,102,0)}}
    .status small{color: rgba(255,255,255,.70); font-weight:800}

    /* Sections */
    section{padding:18px 0}
    .section-title{display:flex; align-items:flex-end; justify-content:space-between; gap:12px; margin:10px 0 12px;}
    .section-title h2{margin:0; font-size:22px; font-weight:900;}
    .section-title .hint{color: rgba(255,255,255,.65); font-size:13px; font-weight:800}

    .panel{
      padding:18px; border-radius: var(--r2);
      background: linear-gradient(180deg, rgba(255,255,255,.08), rgba(255,255,255,.05));
      border:1px solid rgba(255,255,255,.11);
      box-shadow: var(--shadow2);
      backdrop-filter: blur(12px);
    }

    /* Counters */
    .counters{
      display:grid; grid-template-columns: repeat(3, 1fr);
      gap: 12px; margin-top: 12px;
    }
    @media (max-width: 920px){ .counters{grid-template-columns: 1fr;} }
    .countCard{
      border-radius: 20px;
      background: rgba(0,0,0,.16);
      border:1px solid rgba(255,255,255,.10);
      padding: 14px;
      position:relative;
      overflow:hidden;
    }
    .countCard::before{
      content:"";
      position:absolute; inset:-2px;
      background: radial-gradient(420px 160px at 20% 0%, rgba(255,79,163,.22), transparent 60%),
                  radial-gradient(420px 160px at 80% 50%, rgba(255,214,162,.16), transparent 60%);
      opacity:.85;
      pointer-events:none;
    }
    .countCard > *{position:relative}
    .countNum{font-size:28px; font-weight:900; letter-spacing:.2px}
    .countLbl{color: rgba(255,255,255,.70); font-weight:900; margin-top:2px}
    .countNote{color: rgba(255,255,255,.60); font-weight:800; font-size:12px; margin-top:8px; line-height:1.7}

    /* Products gallery */
    .gallery{display:grid; grid-template-columns: repeat(3, 1fr); gap: 12px;}
    @media (max-width: 920px){ .gallery{grid-template-columns: 1fr;} }
    .shot{
      position:relative; border-radius:22px; overflow:hidden;
      border:1px solid rgba(255,255,255,.14);
      background: rgba(255,255,255,.04);
      box-shadow: 0 18px 50px rgba(0,0,0,.45);
    }
    .shot img{width:100%; height:300px; object-fit:cover; display:block; filter:saturate(1.06) contrast(1.02); transition: transform .35s ease;}
    .shot:hover img{transform: scale(1.04)}
    .shot::after{
      content:""; position:absolute; inset:0;
      background: radial-gradient(500px 200px at 50% 110%, rgba(255,79,163,.20), transparent 60%),
                  linear-gradient(180deg, transparent 40%, rgba(0,0,0,.30));
      pointer-events:none;
    }
    .shot .cap{
      position:absolute; left:14px; right:14px; bottom:12px;
      display:flex; align-items:center; justify-content:space-between; gap:10px;
      font-weight:900; z-index:2;
    }
    .cap small{font-weight:800; color: rgba(255,255,255,.75);}

    /* Box buttons */
    .boxBtns{display:flex; gap:10px; flex-wrap:wrap; margin-top:14px;}
    .boxBtns .btn{min-width: 220px}

    /* Reviews slider */
    .slider{
      position:relative;
      overflow:hidden;
      border-radius: 22px;
      border:1px solid rgba(255,255,255,.12);
      background: rgba(0,0,0,.16);
      padding: 14px;
    }
    .slides{
      display:flex;
      gap: 14px;
      transition: transform .55s ease;
      will-change: transform;
    }
    .slide{
      min-width: 100%;
      border-radius: 18px;
      padding: 14px;
      border:1px solid rgba(255,255,255,.10);
      background: rgba(255,255,255,.05);
    }
    .stars{color: var(--gold); letter-spacing: 2px; font-weight: 900}
    .slide p{margin:8px 0 0; color: rgba(255,255,255,.76); line-height:1.9; font-weight:700}
    .slide b{display:block; margin-top:10px; font-weight:900}

    .dots{
      display:flex;
      gap:8px;
      justify-content:center;
      margin-top: 12px;
    }
    .dotBtn{
      width:10px; height:10px;
      border-radius:999px;
      border:1px solid rgba(255,255,255,.16);
      background: rgba(255,255,255,.10);
      cursor:pointer;
      transition:.2s ease;
    }
    .dotBtn.active{
      width:22px;
      background: linear-gradient(135deg, rgba(255,79,163,.95), rgba(255,214,162,.55));
      border-color: rgba(255,255,255,.22);
    }

    /* Floating quick actions */
    .float{position:fixed; left:14px; bottom:14px; z-index:100; display:flex; flex-direction:column; gap:10px;}
    .fab{
      width:54px; height:54px; border-radius:18px;
      display:grid; place-items:center;
      border:1px solid rgba(255,255,255,.14);
      box-shadow: 0 14px 50px rgba(0,0,0,.50);
      backdrop-filter: blur(12px);
      transition:.2s ease;
    }
    .fab:hover{transform: translateY(-2px)}
    .fab.w{background: linear-gradient(135deg, rgba(37,211,102,.95), rgba(37,211,102,.60)); color:#071a10}
    .fab.t{background: linear-gradient(135deg, rgba(0,0,0,.92), rgba(0,0,0,.55));}

    footer{padding: 20px 0 34px; color: rgba(255,255,255,.65); text-align:center; font-size: 12px; font-weight:700}
  </style>
</head>

<body>
  <!-- Preloader -->
  <div class="preloader" id="preloader" aria-label="Loading">
    <div class="prebox">
      <div class="shine"></div>
      <div class="prelogo">
        <img src="logo.png" alt="Glame Chic Logo"
             onerror="this.style.display='none'; this.parentElement.style.background='linear-gradient(135deg, rgba(255,79,163,.35), rgba(255,214,162,.20))'; this.parentElement.innerHTML='<i class=&quot;fa-solid fa-gem&quot; style=&quot;color:rgba(255,255,255,.92);font-size:20px&quot;></i>';">
      </div>
      <div class="ring" aria-hidden="true"></div>
      <div class="pretitle">Glame Chic</div>
      <p class="presub">Luxury Beauty Brand • فخامة أنوثة… مثل الشركات العالمية ✨</p>
    </div>
  </div>

  <!-- Background -->
  <div class="bg" aria-hidden="true">
    <div class="blob b1"></div>
    <div class="blob b2"></div>
    <div class="blob b3"></div>
  </div>
  <div class="sparkles" aria-hidden="true"></div>

  <!-- Topbar -->
  <div class="topbar">
    <div class="container wrap">
      <div class="brand">
        <div class="logo" title="Glame Chic">
          <img src="logo.png" alt="Glame Chic Logo"
               onerror="this.style.display='none'; this.parentElement.style.background='linear-gradient(135deg, rgba(255,79,163,.35), rgba(255,214,162,.20))'; this.parentElement.innerHTML='<i class=&quot;fa-solid fa-gem&quot; style=&quot;color:rgba(255,255,255,.92);font-size:18px&quot;></i>';">
        </div>
        <div>
          <h1>Glame Chic</h1>
          <div class="sub">Luxury Beauty Brand • فخامة أنوثة… مثل الشركات العالمية ✨</div>
        </div>
      </div>

      <div class="nav">
        <a class="pill" href="#about">من نحن</a>
        <a class="pill" href="#products">المنتجات</a>
        <a class="pill" href="#reviews">آراء</a>
        <a class="pill primary" href="#order">اطلب الآن</a>
      </div>
    </div>
  </div>

  <!-- Hero -->
  <header class="hero container reveal"
